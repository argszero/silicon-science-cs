<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="The clustering statistic is scheme-invariant while the tail is not">
<title>The clustering statistic is scheme-invariant while the tail is not</title>
<rect width="940" height="470" fill="#ffffff"/>
<line x1="84.00" y1="400.00" x2="444.00" y2="400.00" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="84.00" y1="332.84" x2="444.00" y2="332.84" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="84.00" y1="265.67" x2="444.00" y2="265.67" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="84.00" y1="198.51" x2="444.00" y2="198.51" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="84.00" y1="131.34" x2="444.00" y2="131.34" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><rect x="84.00" y="40.00" width="360.00" height="360.00" fill="none" stroke="#333333" stroke-width="1.4"/><line x1="79.00" y1="400.00" x2="84.00" y2="400.00" stroke="#333333" stroke-width="1.2"/><text x="75.00" y="404.00" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">0</text><line x1="79.00" y1="332.84" x2="84.00" y2="332.84" stroke="#333333" stroke-width="1.2"/><text x="75.00" y="336.84" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">0.25</text><line x1="79.00" y1="265.67" x2="84.00" y2="265.67" stroke="#333333" stroke-width="1.2"/><text x="75.00" y="269.67" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">0.5</text><line x1="79.00" y1="198.51" x2="84.00" y2="198.51" stroke="#333333" stroke-width="1.2"/><text x="75.00" y="202.51" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">0.75</text><line x1="79.00" y1="131.34" x2="84.00" y2="131.34" stroke="#333333" stroke-width="1.2"/><text x="75.00" y="135.34" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">1</text><text x="264.00" y="448.00" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">the layout's clustering statistic</text><text x="22.00" y="220.00" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal" transform="rotate(-90 22.00 220.00)">fraction of pairs with the SAME longest run</text><rect x="199.20" y="131.34" width="129.60" height="268.66" fill="#111111" stroke="none" opacity="0.85"/><text x="264.00" y="119.34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">144 / 144 = 1.000</text><text x="264.00" y="50.75" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" font-weight="normal">linear probing and Robin Hood fill the SAME set of slots,</text><text x="264.00" y="72.24" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" font-weight="normal">so the longest run is a property of the occupied SET,</text><text x="264.00" y="93.73" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" font-weight="normal">not of the lookup rule (144 pairs).</text><line x1="554.00" y1="382.94" x2="914.00" y2="382.94" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="554.00" y1="272.81" x2="914.00" y2="272.81" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><line x1="554.00" y1="162.68" x2="914.00" y2="162.68" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/><rect x="554.00" y="40.00" width="360.00" height="360.00" fill="none" stroke="#333333" stroke-width="1.4"/><line x1="549.00" y1="382.94" x2="554.00" y2="382.94" stroke="#333333" stroke-width="1.2"/><text x="545.00" y="386.94" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">1</text><line x1="549.00" y1="272.81" x2="554.00" y2="272.81" stroke="#333333" stroke-width="1.2"/><text x="545.00" y="276.81" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">10</text><line x1="549.00" y1="162.68" x2="554.00" y2="162.68" stroke="#333333" stroke-width="1.2"/><text x="545.00" y="166.68" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end" font-weight="normal">100</text><text x="734.00" y="448.00" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">the tail statistic</text><text x="492.00" y="220.00" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal" transform="rotate(-90 492.00 220.00)">p99(linear) / p99(Robin Hood)  (log scale)</text><rect x="584.00" y="341.07" width="60.00" height="58.93" fill="#d62728" stroke="none" opacity="0.85"/><text x="614.00" y="332.07" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">2.4</text><text x="614.00" y="418.00" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" font-weight="normal">min</text><rect x="704.00" y="256.53" width="60.00" height="143.47" fill="#d62728" stroke="none" opacity="0.85"/><text x="734.00" y="247.53" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">14.1</text><text x="734.00" y="418.00" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" font-weight="normal">median</text><rect x="824.00" y="155.66" width="60.00" height="244.34" fill="#d62728" stroke="none" opacity="0.85"/><text x="854.00" y="146.66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">115.8</text><text x="854.00" y="418.00" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" font-weight="normal">max</text><text x="560.00" y="57.59" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="start" font-weight="normal">the same layout, a different lookup rule:</text><text x="560.00" y="83.83" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="start" font-weight="normal">the p99 probe count differs by 2.4x to 115.8x</text><text x="560.00" y="110.13" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#b8860b" text-anchor="start" font-weight="normal">-- so the tail's free variable is not the clustering</text>
</svg>
