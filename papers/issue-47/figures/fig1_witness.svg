<text x="160" y="28" font-size="16" fill="#111" text-anchor="start" font-weight="bold">The witness: an identity by construction, and a measured gap</text>
<text x="160" y="48" font-size="12" fill="#444" text-anchor="start">Two arms carry the same multiset of |error| in every block, differing only in its sign.</text>
<text x="160" y="64" font-size="12" fill="#444" text-anchor="start">The two panels are the two halves of the claim that the scalar error is not sufficient.</text>
<text x="160" y="92" font-size="13" fill="#111" text-anchor="start" font-weight="bold">(A) the identity &#8212; largest scalar-feature gap between the arms, over all 39 blocks</text>
